name: Marketplace search

on:
  workflow_dispatch:
    inputs:
      location:
        description: Marketplace location slug
        required: true
        default: kansas-city
        type: string
      query:
        description: Search phrase
        required: true
        default: car or truck
        type: string

permissions:
  contents: read

jobs:
  search:
    name: Search Facebook Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Marketplace search
        env:
          MARKETPLACE_LOCATION: ${{ inputs.location }}
          MARKETPLACE_QUERY: ${{ inputs.query }}
        run: python python/extract_id.py

      - name: Upload search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-search-results
          path: data/extracted_id/
          if-no-files-found: warn
          retention-days: 7
